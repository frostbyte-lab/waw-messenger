<script>
(function () {
  if (window.WAW) return;
  function respond(title, detail) {
    var old = document.getElementById('waw-action-status');
    if (old) old.remove();
    var el = document.createElement('div');
    el.id = 'waw-action-status';
    el.textContent = title + ' — ' + detail;
    el.style.cssText = 'position:fixed;left:16px;right:16px;bottom:18px;z-index:9999;padding:14px 16px;border-radius:14px;background:#070e0c;color:#fff;font:600 13px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    document.body.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.remove(); }, 3500);
  }
  function pick(type, title) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = type; input.style.display = 'none';
    document.body.appendChild(input);
    input.onchange = function(){ respond(title, input.files && input.files[0] ? input.files[0].name + ' dipilih' : 'dibatalkan'); input.remove(); };
    input.click();
  }
  window.WAW = {
    openRemote: function(){ respond('Remote Access', 'Fungsi remote tersedia di APK Android WAW Workspace'); },
    openLocation: function(){
      if (!navigator.geolocation) return respond('IP & Lokasi Tracker', 'Geolocation tidak didukung browser');
      navigator.geolocation.getCurrentPosition(function(pos){ respond('IP & Lokasi Tracker', 'Lokasi tersedia: ' + pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5)); }, function(){ respond('IP & Lokasi Tracker', 'Izin lokasi ditolak atau belum tersedia'); });
    },
    openTools: function(){ pick('.pdf,.doc,.docx,.txt', 'Scan PDF & Edit Dokumen'); },
    openAttendance: function(){
      if (window.PublicKeyCredential) respond('Absensi Fingerprint', 'Browser mendukung WebAuthn; gunakan APK untuk sensor fingerprint Android');
      else respond('Absensi Fingerprint', 'Gunakan APK Android WAW Workspace untuk fingerprint');
    },
    openWatermark: function(){
      var old=document.getElementById('waw-timestamp-camera'); if(old) old.remove();
      var page=document.createElement('div'); page.id='waw-timestamp-camera'; page.style.cssText='position:fixed;inset:0;z-index:10000;background:#050806;color:#fff;font:14px system-ui;display:flex;flex-direction:column';
      page.innerHTML='<div style="height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#080d0a"><b>Custom Watermark</b><button id="ts-close" style="border:0;background:transparent;color:#fff;font-size:25px">×</button></div><div id="ts-stage" style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#101512;overflow:hidden"><div id="ts-empty" style="text-align:center;color:#9ca3af">Kamera / foto akan tampil di sini<br><small>Pilih Kamera atau Galeri di bawah</small></div><video id="ts-video" autoplay playsinline style="display:none;width:100%;height:100%;object-fit:contain"></video><img id="ts-image" style="display:none;max-width:100%;max-height:100%;object-fit:contain"><div id="ts-overlay" style="display:none;position:absolute;left:16px;bottom:18px;text-shadow:1px 1px 3px #000;font-weight:700;line-height:1.45"><div id="ts-custom">WAW Workspace</div><div id="ts-date"></div><div id="ts-location"></div></div></div><div style="padding:12px 14px 18px;background:#080d0a"><input id="ts-text" placeholder="Teks watermark custom" style="box-sizing:border-box;width:100%;padding:11px 12px;border-radius:10px;border:1px solid #34433a;background:#172019;color:#fff"><div style="display:flex;gap:8px;margin-top:10px"><button id="ts-camera" style="flex:1;padding:12px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:700">Kamera</button><button id="ts-gallery" style="flex:1;padding:12px;border:1px solid #55665a;border-radius:12px;background:#172019;color:#fff">Galeri</button><button id="ts-save" style="flex:1;padding:12px;border:0;border-radius:12px;background:#20d486;color:#05130b;font-weight:800">Simpan</button></div><div style="text-align:center;color:#8f9a92;font-size:11px;margin-top:8px">Timestamp otomatis • Lokasi opsional • Custom watermark</div></div>';
      document.body.appendChild(page);
      var video=page.querySelector('#ts-video'), image=page.querySelector('#ts-image'), empty=page.querySelector('#ts-empty'), overlay=page.querySelector('#ts-overlay'), custom=page.querySelector('#ts-custom'), date=page.querySelector('#ts-date'), loc=page.querySelector('#ts-location'), text=page.querySelector('#ts-text'), stream=null, selected=null;
      function showImage(src){video.style.display='none';image.style.display='block';empty.style.display='none';image.src=src;overlay.style.display='block';}
      function stamp(){custom.textContent=text.value||'WAW Workspace';date.textContent=new Date().toLocaleString('id-ID');if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){loc.textContent=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)},function(){loc.textContent='Lokasi tidak diizinkan'});}
      text.oninput=stamp; page.querySelector('#ts-close').onclick=function(){if(stream)stream.getTracks().forEach(function(t){t.stop()});page.remove()};
      page.querySelector('#ts-gallery').onclick=function(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){if(i.files[0]){selected=i.files[0];showImage(URL.createObjectURL(selected));stamp()}};i.click()};
      page.querySelector('#ts-camera').onclick=function(){if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(s){stream=s;video.srcObject=s;video.style.display='block';image.style.display='none';empty.style.display='none';overlay.style.display='block';stamp()}).catch(function(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=function(){if(i.files[0]){selected=i.files[0];showImage(URL.createObjectURL(selected));stamp()}};i.click()})}else{page.querySelector('#ts-gallery').click()}};
      page.querySelector('#ts-save').onclick=function(){if(!selected&&!video.srcObject){alert('Ambil foto dengan kamera atau pilih gambar dari galeri terlebih dahulu');return}var c=document.createElement('canvas'),ctx=c.getContext('2d'),img=new Image();function finish(){c.width=img.naturalWidth||video.videoWidth;c.height=img.naturalHeight||video.videoHeight;ctx.drawImage(img,0,0,c.width,c.height);ctx.font=Math.max(24,c.width*.035)+'px sans-serif';ctx.fillStyle='white';ctx.strokeStyle='black';ctx.lineWidth=4;var lines=[text.value||'WAW Workspace',new Date().toLocaleString('id-ID')];lines.forEach(function(v,n){ctx.strokeText(v,24,c.height-34-n*38);ctx.fillText(v,24,c.height-34-n*38)});var a=document.createElement('a');a.download='waw-timestamp-watermark.png';a.href=c.toDataURL('image/png');a.click()};if(video.srcObject){img.onload=finish;img.src=video.toDataURL?video.toDataURL():'';if(!img.src) {c.width=video.videoWidth;c.height=video.videoHeight;ctx.drawImage(video,0,0);finish()}}else{img.onload=finish;img.src=image.src}};
    }
    }
  };
})();

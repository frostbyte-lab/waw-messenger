name: WAW Android Release Artifact

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version label"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

env:
  RELEASE_APK: app/build/outputs/apk/release/app-release-unsigned.apk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; producing an unsigned artifact."
          fi

      - name: Sign release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/waw-release.jks"
          mkdir -p app/build/outputs/apk/release/signed
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -f -p 4 "$RELEASE_APK" "$RUNNER_TEMP/waw-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/waw-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/signed/waw-release.apk \
            "$RUNNER_TEMP/waw-release-aligned.apk"
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/release/signed/waw-release.apk

      - name: Prepare unsigned release APK
        if: steps.signing.outputs.configured != 'true'
        run: |
          mkdir -p app/build/outputs/apk/release/test-signed
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/waw-test-release.jks" \
            -storepass changeit -keypass changeit \
            -alias waw-test -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=WAW Test,O=Frostbyte Lab,C=ID"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -f -p 4 "$RELEASE_APK" "$RUNNER_TEMP/waw-test-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/waw-test-release.jks" \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --ks-key-alias waw-test \
            --out app/build/outputs/apk/release/test-signed/waw-release-test-signed.apk \
            "$RUNNER_TEMP/waw-test-aligned.apk"
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/release/test-signed/waw-release-test-signed.apk

      - name: Generate SHA-256 checksums
        run: |
          find app/build/outputs/apk/release -type f -name '*.apk' -print0 \
            | xargs -0 sha256sum > app/build/outputs/apk/release/SHA256SUMS.txt
          cat app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waw-release-${{ inputs.version_name }}-signed
          path: |
            app/build/outputs/apk/release/signed/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test-signed release APK
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waw-release-${{ inputs.version_name }}-test-signed
          path: |
            app/build/outputs/apk/release/test-signed/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

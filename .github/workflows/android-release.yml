name: WAW Android Automatic Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_APK: app/build/outputs/apk/release/app-release-unsigned.apk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version from workflow run
        run: |
          version_name="0.2.${GITHUB_RUN_NUMBER}"
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${version_code}/; s/versionName = \"[^\"]+\"/versionName = \"${version_name}\"/" app/build.gradle.kts
          echo "VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Check production signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Production signing secrets are required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Sign APK with the permanent production key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/waw-release.jks"
          mkdir -p app/build/outputs/apk/release/signed
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -f -p 4 "$RELEASE_APK" "$RUNNER_TEMP/waw-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/waw-release.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/signed/waw-release.apk \
            "$RUNNER_TEMP/waw-release-aligned.apk"
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/release/signed/waw-release.apk

      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/release/signed/waw-release.apk > app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Publish GitHub Release for the updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION_NAME}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WAW ${VERSION_NAME}" \
            --generate-notes \
            app/build/outputs/apk/release/signed/waw-release.apk \
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: waw-${{ env.VERSION_NAME }}-signed
          path: |
            app/build/outputs/apk/release/signed/waw-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      PAIRING_TTL_MS: 120000
      SESSION_TTL_MS: 28800000
    expose:
      - "8787"
    networks: [relay]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]
    networks: [relay]
networks:
  relay:
volumes:
  caddy_data:
  caddy_config:
